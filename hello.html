        <py-config>
            packages = ["micropip"]
        </py-config>
        <script type="py" terminal worker>
            import time, traceback, platform, sys, code, asyncio, pyscript, inspect, builtins, copy

            class stderr:
               """Colored sys.STDERR version by Erkhemee"""
               def __init__(self, original=None):
                   """Initalize colorful stderr"""
                   self.orig = original or sys.stderr
               def write(self, message):
                   """Write colorful error in stderr"""
                   self.orig.write("\033[91m" + str(message) + "\033[0m")
               def flush(self):
                   """Flush it"""
                   self.orig.flush()
            sys.stderr = stderr()
            sys.ps1 = "\033[95m>>> \033[0m"
            sys.ps2 = "\033[92m... \033[0m"
            unknown = "Spect none if none and exec"
            def _help(obj=unknown):
                """Help function by Erkhemee"""
                try:
                    n = "'" + str(obj.__name__) + "'"
                except:
                    try:
                        n = "'" + str(obj.__class__.__name__) + "'"
                    except:
                        n = repr("unknown")
                if obj is unknown:
                   #print("Use help(obj) like \n\033[1m help(print) \033[0m")
                   def hin(prompt):
                      user = input(prompt)
                      if not user.strip(): return ""
                      if user in ["q", "exit", "quit"]:
                        return 'exit()'
                      return "help(" + user + ")"
                   ps1 = sys.ps1
                   sys.ps1 = "help> "
                   code.interact(banner="Help function", exitmsg="Exited help", local={"clear": clear, "input": _input, "help": _help, "_await": asyncio.run, "awaiter": asyncio.run, "fetcher": fetcher, "color": color, "restore": restore, "install": install}, local_exit=True)
                   sys.ps1 = ps1
                else:
                   item = obj.__doc__
                   if item:
                      print("Documention of", n)
                      print(item)
                   else: 
            
                      print("No documention found on", n)
            def restore():
               """Restores layout into normal (colorless)"""
               sys.ps1 = ">>> "
               sys.ps2 = "... "
               sys.stderr = sys.__stderr__
            def color():
               """Color the terminal (if restored or changed color codes)"""
               sys.stderr = stderr()
               sys.ps1 = "\033[95m>>> \033[0m"
               sys.ps2 = "\033[92m... \033[0m"
            def fetcher(url):
                """Gets text from website, then return
                For example, use my loady project, URL is https://raw.githubusercontent.com/Ericwasepic127/loader-python/refs/heads/main/loady.py
                Then, 
                file = fetcher('https://raw.githubusercontent.com/Ericwasepic127/loader-python/refs/heads/main/loady.py')
                exec(file)
                It will execute it
                Now, use as
                loadbar('#')
                """
                try:
                    aw = asyncio.run
                    it = aw(pyscript.fetch(url))
                    if it.ok:
                       re = aw(it.text())
                    else: 
                       re = ""
                    return re
                except:
                  return ""
            inputs = input
            def _input(prompt=""):
                """
                Asks for user input
                """
                i = inputs(str(prompt))
                if inspect.isawaitable(i):
                    return asyncio.run(i)
                else:
                    return i
            builtins.input = _input
            
            cancel = True
            try: 
                import micropip 
                print("[INFO]: Regulary imported micropip")
            except Exception as e:
                cancel = False
                print(f"[ERROR]: Can not use micropip: {e}")
                print("Canceling pip package adding ....")
            
            def cookie_finder():
                if cancel:
                    yes = input("Do you wanna install pip packages (Y/n)? ")
                    if yes.lower() == 'y':
                        packs = input("Enter package name (if multiple, split by space): ")
                        packs = packs.split()
                    else: 
                        packs = []
                else:
                    packs = []
                return packs

            def clear():
                sys.stdout.write("\033c")
                sys.stdout.flush()

            def install(name):
                """Installs pip packages"""
                asyncio.run(micropip.install(name))
            
            async def terminal():
                global cancel
                global micropip
            
                cook = cookie_finder()
                if cook and cancel: 
                    pip = ", ".join(cook) if len(cook) > 1 else cook[0]
                    print(f"Package(s) installing: {pip}")
                    for cooks in cook:
                        print(f"Installing package {cooks}")
                        try:
                           await micropip.install(cooks)
                           print("Installed", cooks)
                        except:
                            print("Failed to install", cooks)
                names = {"clear": clear, "input": _input, "help": _help, "_await": asyncio.run, "awaiter": asyncio.run, "fetcher": fetcher, "color": color, "restore": restore, "install": install} 
                print("Opening terminal ...", end="\r")
                time.sleep(1.125)
                cool = f"\033[0mPython {sys.version} on Browser\n(Erkhemee Edition)\nType clear() for clear screen, help(obj) for object documention"
                cool += ", _await(awaitable) or awaiter(awaitable) for await keyword, fetcher(url_link) for get text from URL"
                cool += ", color() for colorful terminal if you modified or restored, restore() for back for basic colorless terminal"
                cool += ", install(package_name) for install package"
                code.interact(readfunc=_input, banner=cool, exitmsg="\033[0mExiting Erkhemee Terminal ...", local=names, local_exit=True)
            
            print("Hello from Python (Pyodide)", platform.python_version(), "\nVersion of REPL (Erkhembayr edition): \nV2.4.8")
            print("Program doesn't store your data, so don't worry!")
            print("Hint: Try entering @:/\\:@ (Developer-Mode)")
            name = input("What is your name? ")
            if name != "@:/\\:@": 
                favs = ["Minecraft movie", "Chicken", "Strawberry", "Potato", "Geometry dash and Minecraft"]
                favr = ["Movie", "Food", "Fruit", "Vegetable", "Game"]
                for fav in favr: 
                     user = input(f"{name}'s (Your) Favourite {fav}: ")
                print("My name is Erkhembayr")
                for a in [0, 1, 2, 3, 4]: 
                    print(f"Erkhembayr's (My) Favourite {favr[a]}: {favs[a]}")
                selector = input("Do you want to open python terminal (yes/no): ")
                selector = selector.lower()
                if selector == "yes":
                    try:
                        await terminal()
                    except Exception as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e)
                    except BaseException as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e)
                else:
                    print("Bye!")
                
            else: 
                print("Secret: UNLOCKED! You entered @:/\\:@")
                try:
                    await terminal()
                    time.sleep(2.825)
                    print("Exited Erkhemee Terminal!")
                except BaseException as e:
                    print(f"\n\nTerminal crashed by error {e.__class__.__name__}: {e}")
                    print("Consider refresh webpage and run again")
            print("\033[0mRefresh for restart")
            print("============Program ended!============")
            print("\033[?25l", end="", flush=True)
        </script>
