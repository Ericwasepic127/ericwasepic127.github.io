<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>PyScript - Python on website</title>
        <script src="./mini-coi-fd.js"></script>
        <script type="module" src="./pyscript/core.js" offline></script>
        <link rel="stylesheet" href="./pyscript/core.css">
        <link rel="icon" type="image/png" sizes="499x499" href="python.png">
    </head>
    <body>
        <a href="/index.html"> Back to homepage </a>
        <p>==========================================</p>
        <py-config>
            packages = ["micropip"]
        </py-config>
        <script type="py" terminal worker>
            import time, traceback, platform, sys, code, asyncio

            def _help(obj="+++"):
                """Help function by Erkhemee"""
                if obj == "+++":
                   print("Use help(obj) like \n\033[1m help(print) \033[0m")
                else:
                   item = obj.__doc__
                   if item:
                      print("Documention of", obj.__name__)
                      print(item)
                   else: 
                      print("No documention found on", obj.__name__)
            
            def _input(prompt=""):
                """
                Asks for user input
                """
                return asyncio.run(input(str(prompt)))
            
            cancel = True
            try: 
                import micropip 
                print("[INFO]: Regulary imported micropip")
            except Exception as e:
                cancel = False
                print(f"[ERROR]: Can not use micropip: {e}")
                print("Canceling pip package adding ....")
            
            async def cookie_finder():
                if cancel:
                    yes = await input("Do you wanna install pip packages (Y/n)? ")
                    if yes.lower() == 'y':
                        packs = await input("Enter package name (if multiple, split by space): ")
                        packs = packs.split()
                    else: 
                        packs = []
                else:
                    packs = []
                return packs

            def clear():
                sys.stdout.write("\033c")
                sys.stdout.flush()
            
            async def terminal():
                global cancel
                global micropip
            
                cook = await cookie_finder()
                if cook and cancel: 
                    pip = ", ".join(cook) if len(cook) > 1 else cook[0]
                    print(f"Package(s) installing: {pip}")
                    for cooks in cook:
                        print(f"Installing package {cooks}", end="\r")
                        await micropip.install(cooks)
                names = {**globals(), **locals(), "input": _input, "help": _help, "_await": asyncio.run, "awaiter": asyncio.run} 
                print("Opening terminal ...", end="\r")
                time.sleep(2.825)
                cool = f"Python {sys.version} \n(Erkhemee Edition)\nType clear() for clear screen, help(obj) for object documention"
                cool += ", _await(awaitable) or awaiter(awaitable) for await keyword"
                code.interact(readfunc=_input, banner=cool, exitmsg="Exiting Erkhemee Terminal ... \r\r\r", local=names, local_exit=True)
            
            print("Hello from Python (Pyodide)", platform.python_version(), "\nVersion of REPL (Erkhembayr edition): \nV2.2.9")
            print("Program doesn't store your data, so don't worry!")
            print("Hint: Try entering @:/\\:@ (Developer-Mode)")
            name = await input("What is your name? ")
            if name != "@:/\\:@": 
                favs = ["Minecraft movie", "Chicken", "Strawberry", "Potato", "Geometry dash and Minecraft"]
                favr = ["Movie", "Food", "Fruit", "Vegetable", "Game"]
                for fav in favr: 
                     user = await input(f"{name}'s (Your) Favourite {fav}: ")
                print("My name is Erkhembayr")
                for a in [0, 1, 2, 3, 4]: 
                    print(f"Erkhembayr's (My) Favourite {favr[a]}: {favs[a]}")
                selector = await input("Do you want to open python terminal (yes/no): ")
                selector = selector.lower()
                if selector == "yes":
                    try:
                        await terminal()
                    except Exception as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e)
                    except BaseException as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e)
                else:
                    print("Bye!")
                
            else: 
                print("Secret: UNLOCKED! You entered @:/\\:@")
                try:
                    await terminal()
                    time.sleep(2.825)
                    print("Exited Erkhemee Terminal!")
                except BaseException as e:
                    print(f"\n\nTerminal crashed by error {e.__class__.__name__}: {e}")
                    print("Consider refresh webpage and run again")
            print("Refresh for restart")
            print("============Program ended!============")
            print("\033[?25l", end="", flush=True)
        </script>
    </body>
</html>
