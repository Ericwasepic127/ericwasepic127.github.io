<!DOCTYPE html>
<html>
<head>
  <title>Redirecting</title>
  <script>
    // Redirect, preserving any query string
    const query = window.location.search;
    window.location.href = 'https://supy3.onrender.com/hello.html' + query;
  </script>
</head>
<body>
  <p>Redirecting to the page...</p>
  <p>If not redirected, click <a href="https://supy3.onrender.com/hello.html">here</a></p>
</body>
</html>
