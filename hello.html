        <script type="py" terminal worker>
            import time, traceback, platform, sys, code, asyncio, pyscript, inspect, builtins
            from pyscript import storage as s
            from asyncio import run as a
            from random import choice as c
            class stderr:
               """Colored sys.STDERR version by Erkhemee"""
               def __init__(self, original=None):
                   """Initalize colorful stderr"""
                   self.orig = original or sys.stderr
               def write(self, message):
                   """Write colorful error in stderr"""
                   self.orig.write("\033[91m" + str(message) + "\033[0m")
               def flush(self):
                   """Flush it"""
                   self.orig.flush()
            sys.stderr = stderr()
            sys.ps1 = "\033[95m>>> \033[0m"
            sys.ps2 = "\033[92m... \033[0m"

            def restore():
               """Restores layout into normal (colorless)"""
               sys.ps1 = ">>> "
               sys.ps2 = "... "
               sys.stderr = sys.__stderr__
            def color():
               """Color the terminal (if restored or changed color codes)"""
               sys.stderr = stderr()
               sys.ps1 = "\033[95m>>> \033[0m"
               sys.ps2 = "\033[92m... \033[0m"
            def fetcher(url):
                """Gets text from website, then return
                For example, use my loady project, URL is https://raw.githubusercontent.com/Ericwasepic127/loader-python/refs/heads/main/loady.py
                Then, 
                file = fetcher('https://raw.githubusercontent.com/Ericwasepic127/loader-python/refs/heads/main/loady.py')
                exec(file)
                It will execute it
                Now, use as
                loadbar('#')"""
                try:
                    aw = asyncio.run
                    it = aw(pyscript.fetch(url))
                    if it.ok:
                       re = aw(it.text())
                    else: 
                       re = ""
                    return re
                except:
                  return ""
            inputs = input
            sys.input_save = inputs # Debug: true
            def _input(prompt=""):
                """Asks for user input"""
                i = inputs(str(prompt))
                if inspect.isawaitable(i):
                    return asyncio.run(i)
                else:
                    return i
            builtins.input = _input

            class Input:
                def __init__(self):
                   self.shortcuts = {}
                   self.obj = SLD("history")
                   if not self.obj["saves"]:
                       self.obj.save("saves", [])
                   if not self.obj["limit"]:
                       self.obj.save("limit", 50)
                   self._history = obj["saves"]
                   self._limit = obj["limit"]
                def limit(self, does=50):
                    """
                    Sets limit for history
                    If no arguments, sets default (50)
                    - Negative or 0 for no savings and resets history
                    - 'inf' for infinity
                    """
                    if not type(does) is float:
                       try:
                         does = float(does)
                       except:
                          traceback.print_exc()
                          return
                    if does == float('inf') or does >= 1000:
                       print("WARNING! THIS MIGHT CAN USE RAM LOT WHEN HISTORY GOES LOT\nAND MAY CRASH YOUR PC DUE OUT OF RAM", file=sys.stderr)
                       if input("Continue? (Y/n) ") == "Y":
                           self._limit = does
                           print(f"LIMIT SET FOR {does} IN CURRENT SESSION", file=sys.stderr)
                           return
                       else:
                         return
                    if does <= 0:
                       print("WARNING! IT WILL NOT SAVE HISTORY ANYMORE AND DELETES HISTORY", file=sys.stderr)
                       if input("Continue? (Y/n) ") == "Y":
                           self._limit = does
                           self._history = []
                           print("History reseted and not saving in CURRENT SESSION", file=sys.stderr)
                           return
                       else:
                         return
                    
                    self._limit = does
                    self.obj["limit"] = self._limit
                    print(f"Limit has been set to {does}!")
                    
                def __call__(self, prompt=""):
                   user = input(prompt)
                   self._history.append(user) if user.strip() else None
                   if len(self._history) >= self._limit:
                      del self._history[0]
                   self.obj.save("saves", self._history) if not limit >= 0 else None
                   m = user.split()
                   if m:
                       if m[0] in self.shortcuts.keys():
                          h = m[0]
                          m.remove(m[0])
                          try:
                            self.shortcuts.get(h)(*m)
                          except:
                             traceback.print_exc()
                          return ""
                   return user
                def assign(self, call, do):
                    self.shortcuts[call] = do
                def history(self, raw=False):
                   """Shows terminal history"""
                   if raw:
                      return self._history
                   print("-\033[7m", "\033[0m\n- \033[7m".join(self._history), "\033[0m")
            sys.Input = Input # debug: true
                def clshist(self):
                    """Clears history from persistent storage"""
                    self.obj.save("saves", [])
            
            class SLD:
                 def __init__(self, name=None):
                    if name is None:
                        q = "qwertyuiopasdfghjklzxcvbnm1234567890"
                        name = "".join([c(q) for _ in "-"*6])
                    self.name = name
                    self.storage = a(s(name))
                 def __repr__(self):
                     return f"<pyscript.storage (SLD): {self.name}>"
                 def sync(self):
                     """Synchronization"""
                     a(self.storage.sync())
                 def save(self, name, item):
                     """Saves item to persistent storage"""
                     self.storage[name] = item
                     self.sync()
                 def load(self, name):
                     """Loads item from persistent storage"""
                     self.sync()
                     return self.storage.get(name)
                 def delete(self, name):
                     """Deletes item from persistent storage"""
                     if name in self.storage.keys():
                         del self.storage[name]
                         self.sync()
                     else:
                         raise KeyError(f"Key {name} doesn't exist!")
                 def __getitem__(self, name):
                     return self.load(name)
                 def __delitem__(self, name):
                     self.delete(name)
                 def __setitem__(self, name, value):
                     self.save(name, value)
                 def help(self):
                     """A small helping tool. Run as `storage.help`"""
                     x = """This is persistent storage, and here's guide to use.
                     1. How to save?
                     - Use 'storage.save(name, value)' or 'storage[name] = value'.
                       * For example, `storage.save("variable1", 20)`
                     2. How to load?
                     - Use 'storage.load(name)' or 'storage[name]'. If name doesn't found, it returns None.
                       * For example, `storage["variable1"]` returns 20 if we saved as above
                     3. How to delete?
                     - Use 'storage.delete(name)' or 'del storage[name]'. If name doesn't found, KeyError raises.
                       * For example, `del storage["variable1"]` will delete variable1 from persistent storage, if added
                     
                     A small knowledge just for you:
                       Q: Does it use internet and cloud uploading?
                       A: No, it saves onto your browser storage called indexedDB
                     """
                     print(x)
            
            cancel = True
            try: 
                import micropip 
                print("[INFO]: Regulary imported micropip")
            except Exception as e:
                cancel = False
                print(f"[ERROR]: Can not use micropip: {e}")
                print("Canceling pip package adding ....")
            
            def cookie_finder():
                if cancel:
                    yes = input("Do you wanna install pip packages (Y/n)? ")
                    if yes.lower() == 'y':
                        packs = input("Enter package name (if multiple, split by space): ")
                        packs = packs.split()
                    else: 
                        packs = []
                else:
                    packs = []
                return packs

            def clear():
                sys.stdout.write("\033c")
                sys.stdout.flush()

            def install(*name):
                """Installs pip packages"""
                if cancel:
                  asyncio.run(micropip.install(name))
                else:
                   raise Exception("Can't install packages because micropip doesn't loaded yet")
            
            async def terminal():
                global cancel
                global micropip
            
                cook = cookie_finder()
                if cook and cancel: 
                    pip = ", ".join(cook) if len(cook) > 1 else cook[0]
                    print(f"Package(s) installing: {pip}")
                    for cooks in cook:
                        print(f"Installing package {cooks}")
                        try:
                           await micropip.install(cooks)
                           print("Installed", cooks)
                        except:
                            print("Failed to install", cooks)
                reader = Input()
                reader.assign("%history", reader.history)
                reader.assign("%clear", clear)
                reader.assign("%color", color)
                reader.assign("%restore", restore)
                reader.assign("%install", install)
                reader.assign("%limit", reader.limit)
                reader.assign("%help", help)
                reader.assign("%clean_history", reader.clshist)
                
                names = {"storage": SLD("Userspace"), "limit": reader.limit, "clear": clear, "_await": asyncio.run, "awaiter": asyncio.run, "fetcher": fetcher, "color": color, "restore": restore, "install": install, "history": reader.history} 
                print("Opening terminal ...", end="\r")
                time.sleep(1.125)
                cool = f"\033[93mPython {sys.version} on Browser\n(Erkhemee Edition: Py3REPL)\nType 'clear()' for clear screen (*), 'help(obj)' (%help obj) for object documention (*)"
                cool += ", limit(set_limit) for set history limit (*), '_await(awaitable)' or 'awaiter(awaitable)' for await keyword, 'fetcher(url_link)' for get text from URL"
                cool += ", 'color()' for colorful terminal if you modified or restored (*), 'restore()' for back for basic colorless terminal (*)"
                cool += ", 'install(package_name)' (%install package1 package2) for install package (*), 'history()' for history getting (*), 'storage' for a persistent storage (\033[1mTip: try storage.help()\033[0m), '%clean_history' to clear history in persistent storage. \n\033[1mTip: (*) functions had '%' shortcuts (like %clear, e.g.)"
                code.interact(readfunc=reader, banner=cool, exitmsg="\033[94mExiting Erkhemee Terminal ...", local=names, local_exit=True)
            
            print("\033[92mHello from Python (Pyodide)", platform.python_version(), "\nVersion of REPL (Erkhembayr edition): \nV2.6.6")
            print("\033[92mProgram doesn't store your data, so don't worry!")
            print("\033[92mHint: Try entering @:/\\:@ (Developer-Mode)\033[0m")
            name = input("\033[1mWhat is your name?\033[0m ")
            if name != "@:/\\:@": 
                favs = ["\033[93mMinecraft movie", "\033[91mChicken", "\033[92mStrawberry", "\033[94mPotato", "\033[95mGeometry dash and Minecraft"]
                favr = ["\033[93mMovie", "\033[91mFood", "\033[92mFruit", "\033[94mVegetable", "\033[95mGame"]
                for fav in favr: 
                     input(f"\033[1m{name}'s (Your) Favourite \033[0m{fav}\033[0m: ")
                print("\033[96mMy name is Erkhembayr")
                for a in [0, 1, 2, 3, 4]: 
                    print(f"\033[0m\033[1mErkhembayr's (My) Favourite \033[0m{favr[a]}\033[0m: {favs[a]}")
                selector = input("\033[0m\033[1mDo you want to open python terminal \033[0m(yes/no): ")
                selector = selector.lower()
                if selector == "yes":
                    try:
                        await terminal()
                    except Exception as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e, file=stderr())
                    except BaseException as e:
                        print(f"Terminal crashed by {e.__class__.__name__}:", e, file=stderr())
                else:
                    print("\033[94m Bye!")
                
            else: 
                print("\033[92mSecret: UNLOCKED! You entered @:/\\:@")
                try:
                    await terminal()
                    time.sleep(2.825)
                    print("\033[94mExited Erkhemee Terminal!")
                except (BaseException, Exception) as e:
                    print(f"\n\nTerminal crashed by error {e.__class__.__name__}: {e}", file=stderr())
                    print("Consider refresh webpage and run again")
            print("\033[94mRefresh for restart")
            print("\033[94m============Program ended!============")
            print("\033[?25l", end="", flush=True)
