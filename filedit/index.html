<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SUPY3MULTI - Run multiple python files</title>
    <script type="module" src="./pyscript/core.js"></script>
    <link rel="stylesheet" href="./pyscript/core.css">
</head>
<body>
    <p><a href="../ide.html">Back to single file editor</a> | <a href="./editor.html" target="_blank">Open editor</a></p>
    <h3>Welcome to SUPY3MULTI!</h3>
    <p><strong>Do not close this tab!</strong></p>
    <p>Connected editors: <span id="clientCount">0</span></p>

    <script type="py">
        import js, pyscript
        data = await pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py")
        with open("m2w.py", "w") as f:
            f.write(await data.text()) if data.ok else None
        import m2w
        connect = m2w.Main("#exec")
        from pyodide.ffi import create_proxy

        shared = js.SharedWorker.new('./shared-worker.js')
        shared.port.start()
        port = shared.port
        port.postMessage(js.to_js({'type': 'registerServer'}))
        async def fakeput(msg):
            f = asyncio.Future()
            def on_response(event):
                data = event.data.to_py()
                if data.get('type') == 'input_response':
                    f.set_result(data.get('value'))

        port.onmessage = connect.worker.onmessage

        def update_client_count():
            count = len(js.Array.from(js.self.clients))
            js.document.querySelector('#clientCount').textContent = count

        js.setInterval(create_proxy(update_client_count), 1000)
    </script>

    <script type="py" terminal worker id="exec" hidden>
        import js, asyncio, pyscript, traceback 
        from pyscript import sync
        from pyodide.ffi import create_proxy

        data = await pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py")
        with open("m2w.py", "w") as f:
            f.write(await data.text()) if data.ok else None
        import m2w

        connect = m2w.Worker()

        
        sync.pyterminal_read = fakeput

        def terminal_write(data):
            port.postMessage(js.to_js({
                'type': 'output',
                'data': data
            }))

        sync.pyterminal_write = terminal_write
        def on_message(event):
            data = event.data.to_py()
            if data.get('type') == 'run':
                code = data.get('code')
                try:
                    exec(code, {})
                except Exception as e:
                    traceback.print_exc()
        connect.handler(on_message)
    </script>
</body>
</html>
