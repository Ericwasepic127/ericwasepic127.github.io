    <style>
        body {

        }
        .editor-container {
            display: flex;
            border: 1px solid #ccc;
            background: #fff;
        }

<body>
    <py-config>
        packages = ["micropip"]
    </py-config>
    <a href="/index.html">Back to homepage</a>

    <a href="/hello.html">Go to REPL version</a>
    <hr>
    <p><strong>Py3IDE Version: V3.5.9</strong></p>
    <hr>
    <button id="pipIn" disabled>Install pip package</button>
    <button id="pipLs" disabled>List all installed pip packages</button>
    <button id="dwnldBtn">Download code into storage</button>
    <button id="loadBtn">Upload code from storage</button>
    <h2 id="ready">Loading PyScript ... Please wait!</h2>
    <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="codeInput" placeholder="Write your Python code here..." spellcheck="false"></textarea>
    </div>
    <div class="status-bar">
        <span id="statusLine">Line 1</span> &nbsp;|&nbsp; <span id="statusChar">Chars: 0</span>
    </div>

    <script>
        const textarea = document.getElementById('codeInput');
        const lineNumbers = document.getElementById('lineNumbers');
        const statusLine = document.getElementById('statusLine');
        const statusChar = document.getElementById('statusChar');

        function updateEditor() {
            const lines = textarea.value.split('\n');
            let numbers = '';
            for (let i = 1; i <= lines.length; i++) {
                numbers += i + '\n';
            }
            lineNumbers.textContent = numbers;

            const cursorPos = textarea.selectionStart;
            const textBefore = textarea.value.substring(0, cursorPos);
            const currentLine = textBefore.split('\n').length;
            statusLine.textContent = `Line ${currentLine} of ${lines.length}`;
            statusChar.textContent = `Chars: ${textarea.value.length}`;
        }

        textarea.addEventListener('input', updateEditor);
        textarea.addEventListener('click', updateEditor);
        textarea.addEventListener('keyup', updateEditor);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateEditor();
            }
        });

        function downloadCode() {
            const code = document.getElementById('codeInput').value;
            if (!code.trim()) {
                alert('No code to download!');
                return;
            }
            const ins = prompt("Enter filename (extension will automatically added)", "script")
            if (ins === null) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (ins.trim() || "script") + '.py';
            a.click();
            URL.revokeObjectURL(url);
        }
        document.getElementById('dwnldBtn').onclick = downloadCode;

        function loadCode() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.py,.txt';

                input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = function(event) {
                                const code = event.target.result;
                                document.getElementById('codeInput').value = code;
                                updateEditor();
                        };
                        reader.readAsText(file);
                };

                input.click();
        }
        document.getElementById('loadBtn').onclick = loadCode
        
        updateEditor();
        textarea.focus();
    </script>
    <script type="py">
        import pyscript, asyncio, micropip
        data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))
        with open("m2w.py", "w") as file:
            file.write(asyncio.run(data.text())) if data.ok else None
        import js, m2w
        from pyodide.ffi import create_proxy, JsNull as null
        connect = m2w.Main(id="#executer")
        def codeparse(): 
            return pyscript.document.querySelector("#codeInput").value
        def onrun(event):
            if connect.getmsg:
                js.alert("Already running code!")
            else:
                connect.sendmsg(codeparse())
        run_btn = pyscript.document.querySelector("#runBtn")
        run_btn.addEventListener("click", create_proxy(onrun))
        run_btn.disabled = False
        
        def inp(event):
            packages = js.prompt("Enter package name (if multiple, split by space)")
            if packages is null:
                return
            if not packages:
                return
            package_list = packages.split()
            run = [
                "print('-----Pip package installer-----')",
                "import asyncio, micropip",
                f"for p in {package_list}:",
                "    try:",
                "        asyncio.ensure_future(micropip.install(p))",
                "        print(f'Installed package {p} successfully' if p in micropip.list().keys() else 'Something went wrong')",
                "    except Exception as e:",
                "        print(f'Failed to install package {p}: {str(e)}')"
            ]
            if connect.getmsg:
                js.alert("Code has been executing, once stopped, you can install")
                return
            js.alert("Results are at Terminal")
            connect.sendmsg("\n".join(run))
            
        def lsp(event):
            run = [
                "import micropip",
                "print(\"-------Pip packages list-------\")",
                "name = micropip.list().keys()",
                "names = name",
                "if len(names) > 50:",
                "    names = name[:49]",
                "    names.append(f\"and {len(name) - 50} more\")",
                "build = '- ' + '\\n- '.join(names)",
                "print('Pip packages installed:')",
                "print(build)"
            ]
            if connect.getmsg:
                js.alert("Code has been executing, once stopped, you can install")
                return
            js.alert("Results are at Terminal")
            connect.sendmsg("\n".join(run))

        def stopBtn(event):
            if connect.getmsg:
                 connect.sendmsg("STOP")
            else:
                 js.alert("Cannot stop when code is not running")
        
        pip = [pyscript.document.querySelector("#pipLs"), pyscript.document.querySelector("#pipIn"), pyscript.document.querySelector("#stopBtn")]
        for x in pip:
            x.disabled = False
        pip[0].onclick = create_proxy(lsp)
        pip[1].onclick = create_proxy(inp)
        pip[2].onclick = create_proxy(stopBtn)
        pyscript.document.querySelector("#ready").innerHTML = "Loaded PyScript! Ready to run!"
    </script>

    <button id="runBtn" disabled>Run</button>
    <button id="stopBtn" disabled>Stop</button>
    <h3>Terminal/Output</h3>
    <script type="py" terminal worker id="executer">
    import pyscript, asyncio
    data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))
    with open("m2w.py", "w") as file:
        file.write(asyncio.run(data.text())) if data.ok else None
    import m2w, time, traceback, builtins, inspect, os, sys

    class stderr:
        """Colored sys.STDERR version by Erkhemee"""
        def __init__(self, original=None):
            """Initalize colorful stderr"""
            self.orig = original or sys.stderr
        def write(self, message):
            """Write colorful error in stderr"""
            self.orig.write("\033[91m" + str(message) + "\033[0m")
        def flush(self):
            """Flush it"""
            self.orig.flush()
    sys.stderr = stderr()
        
    inputs = input
    def _input(prompt=""):
        """Asks for user input"""
        i = inputs(str(prompt))
        if inspect.isawaitable(i):
            return asyncio.run(i)
        else:
            return i
    async def run_code(code):
        def runable(c):
            svs = {}
            for line in c:
               try:
                   res = repr(eval(line, svs))
                   if res:
                       print(f"- From line {c.index(line) + 1}:\033[1m", res, "\033[0m")
               except SyntaxError:
                   exec(line, svs)
        try:
            await asyncio.to_thread(runable, code.split("\n"))
        except asyncio.CancelledError:
            try:
                raise KeyboardInterrupt
            except:
                traceback.print_exc()
        except SystemExit:
            print("Looks like you've run exit()!")
        except:
            print("Error occured! Details:")
            traceback.print_exc()
        finally:
            print("\033[95m=======\033[96mEND\033[95m=======\033[0m")

    async def timer():
        while 1:
            if connect.getmsg == "STOP":
                 break
            await asyncio.sleep(.0825)
        
    async def runcode(code):
        done, pending = await asyncio.wait([asyncio.create_task(run_code(code)), asyncio.create_task(timer())], return_when=asyncio.FIRST_COMPLETED)
        for task in pending:
            task.cancel()
        
    builtins.input = _input
    connect = m2w.Worker()
    cd = os.getcwd()
    print(f"\033[93mReady to run! Python version: {sys.version}\033[0m")
    while 1:
        if connect.getmsg:
            if connect.getmsg == "STOP":
                print("\033c\033[93mWrong code gathered, skipping\033[0m")
                continue
            os.chdir(cd)
            connect.sendmsg("dontrun")
            print("\033c\033[92mCode executing ...\033[96m")
            await runcode(connect.getmsg)
            connect.getmsg = None
            connect.sendmsg("")
        time.sleep(.0825)
    </script>
