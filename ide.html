<!DOCTYPE html>
<html>
<head>
    <meta property="og:title" content="PyScript Python IDE">
    <meta property="og:description" content="Python environment in your browser">
    <meta property="og:image" content="python.png">
    <meta name="description" content="Run Python in your browser with PyScript">
    <meta name="keywords" content="python, pyscript, ide, terminal, offline, browser, programming, erkhemee, pyodide, ericwasepic127, Py3IDE">
    <meta name="author" content="Erkhemee">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="./mini-coi-fd.js"></script>
    <script type="module" src="./pyscript/core.js" offline></script>
    <link rel="stylesheet" href="./pyscript/core.css">
    <link rel="icon" type="image/png" sizes="499x499" href="python.png">
    <title>Py3IDE - Run python code with IDE!</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
        }
        .editor-container {
            display: flex;
            border: 1px solid #ccc;
            background: #fff;
        }
        .line-numbers {
            color: #888;
            text-align: right;
            padding: 8px 10px;
            user-select: none;
            pointer-events: none;
            border-right: 1px solid #ccc;
            background: #f8f8f8;
            white-space: pre;
            line-height: 1.5;
            font-size: 0.9rem;
            overflow: hidden;
        }
        #codeInput {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            padding: 8px 12px;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
            min-height: 400px;
            background: #fff;
            color: #000;
        }
        .status-bar {
            font-size: 0.8rem;
            color: #555;
            padding: 4px 0;
            border-top: 1px solid #ccc;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <py-config>
        packages = ["micropip"]
    </py-config>
    <a href="/index.html">Back to homepage</a>
    <hr>
    <a href="/hello.html">Go to REPL version</a>
    <hr>
    <p><strong>Py3IDE Version: v2.9.9</strong></p>
    <hr>
    <button id="runBtn" disabled>Run</button>
    <button id="pipIn" disabled>Install pip package</button>
    <button id="pipLs" disabled>List all installed pip packages</button>
    <button id="dwnldBtn">Download code into storage</button>
    <button id="loadBtn">Upload code from storage</button>
    <p id="ready">Loading PyScript ... Please wait!</p>
    <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="codeInput" placeholder="Write your Python code here..." spellcheck="false"></textarea>
    </div>
    <div class="status-bar">
        <span id="statusLine">Line 1</span> &nbsp;|&nbsp; <span id="statusChar">Chars: 0</span>
    </div>

    <script>
        const textarea = document.getElementById('codeInput');
        const lineNumbers = document.getElementById('lineNumbers');
        const statusLine = document.getElementById('statusLine');
        const statusChar = document.getElementById('statusChar');

        function updateEditor() {
            const lines = textarea.value.split('\n');
            let numbers = '';
            for (let i = 1; i <= lines.length; i++) {
                numbers += i + '\n';
            }
            lineNumbers.textContent = numbers;

            const cursorPos = textarea.selectionStart;
            const textBefore = textarea.value.substring(0, cursorPos);
            const currentLine = textBefore.split('\n').length;
            statusLine.textContent = `Line ${currentLine} of ${lines.length}`;
            statusChar.textContent = `Chars: ${textarea.value.length}`;
        }

        textarea.addEventListener('input', updateEditor);
        textarea.addEventListener('click', updateEditor);
        textarea.addEventListener('keyup', updateEditor);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateEditor();
            }
        });

        function downloadCode() {
            const code = document.getElementById('codeInput').value;
            if (!code.trim()) {
                alert('No code to download!');
                return;
            }
            const ins = prompt("Enter filename (extension will automatically added)", "script")
            if (ins === null) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (ins.trim() || "script") + '.py';
            a.click();
            URL.revokeObjectURL(url);
        }
        document.getElementById('dwnldBtn').onclick = downloadCode;

        function loadCode() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.py,.txt';

                input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = function(event) {
                                const code = event.target.result;
                                document.getElementById('codeInput').value = code;
                                updateEditor();
                        };
                        reader.readAsText(file);
                };

                input.click();
        }
        document.getElementById('loadBtn').onclick = loadCode
        
        updateEditor();
        textarea.focus();
    </script>
    <script type="py">
        import pyscript, asyncio, micropip
        data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))
        with open("m2w.py", "w") as file:
            file.write(asyncio.run(data.text())) if data.ok else None
        import js, m2w
        from pyodide.ffi import create_proxy
        connect = m2w.Main()
        def codeparse(): 
            return pyscript.document.querySelector("#codeInput").value
        def onrun(event):
            if connect.getmsg:
                js.alert("Already running code!")
            else:
                connect.sendmsg(codeparse())
        run_btn = pyscript.document.querySelector("#runBtn")
        run_btn.addEventListener("click", create_proxy(onrun))
        run_btn.disabled = False
        def inp(event):
            packages = js.prompt("Enter package name (if multiple, split by space)")
            if packages is None:
               return
            for package in packages.split():
              try:
                   asyncio.create_task(micropip.install(package))
                   js.alert(f"Installed {package} successfully!" if package in micropip.list().keys() else f"Something went wrong when installing package {package}")
              except Exception as e:
                   js.alert(f"Failed to install {package}\nDetails: {str(e)}")
        def lsp(event):
            name = micropip.list().keys()
            names = name
            if len(names) > 50:
                 names = name[:49]
                 names.append(f"and {len(name) - 50} more")
            build = "- " + "\n- ".join(names)
            js.alert(f"Installed package(s):\n{build}" if name else "Not installed packages, yet")
        pip = [pyscript.document.querySelector("#pipLs"), pyscript.document.querySelector("#pipIn")]
        for x in pip:
            x.disabled = False
        pip[0].onclick = create_proxy(lsp)
        pip[1].onclick = create_proxy(inp)
        pyscript.document.querySelector("#ready").innerHTML = "Loaded PyScript! Ready to run!"
    </script>
    <script type="py" terminal worker>
    import pyscript, asyncio
    data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))
    with open("m2w.py", "w") as file:
        file.write(asyncio.run(data.text())) if data.ok else None
    import m2w, time, traceback, sys, asyncio, builtins, inspect
    class stderr:
        """Colored sys.STDERR version by Erkhemee"""
        def __init__(self, original=None):
            """Initalize colorful stderr"""
            self.orig = original or sys.stderr
        def write(self, message):
            """Write colorful error in stderr"""
            self.orig.write("\033[91m" + str(message) + "\033[0m")
        def flush(self):
            """Flush it"""
            self.orig.flush()
    sys.stderr = stderr()
    inputs = input
    def _input(prompt=""):
        """Asks for user input"""
        i = inputs(str(prompt))
        if inspect.isawaitable(i):
            return asyncio.run(i)
        else:
            return i
    builtins.input = _input
    connect = m2w.Worker()
    print(f"Ready to run! Python version: {sys.version}")
    while 1:
        if connect.getmsg:
            connect.sendmsg("dontrun")
            try:
                print("\033cCode executing ...")
                exec(connect.getmsg)
            except:
                print("\nError occured! Details:")
                traceback.print_exc()
            finally:
                print("=======END=======")
            connect.getmsg = None
            connect.sendmsg("")
        time.sleep(.0825)
    </script>
