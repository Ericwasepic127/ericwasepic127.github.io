    <script type="module">
        window.console.log(`[codemirror/main]: Starting up`)
        import { EditorView, basicSetup, placeholder } from '@codemirror/view';
        import { EditorState } from '@codemirror/state';
        import { keymap } from '@codemirror/view';
        import { defaultKeymap, history, historyKeymap } from '@codemirror/commands';
        import { python } from '@codemirror/lang-python';
        import { indentUnit } from '@codemirror/language';
        import { autocompletion } from '@codemirror/autocomplete';
        import { searchKeymap } from '@codemirror/search';
        import { commentKeymap } from '@codemirror/comment';
        import { eclipse } from '@codemirror/theme-eclipse';
        window.console.log(`[codemirror/main]: Imported success`)
        const editor = new EditorView({
            state: EditorState.create({
                lineNumbers: true,
                extensions: [
                    eclipse, 
                    basicSetup,
                    python(),
                    indentUnit.of("    "),
                    history(),
                    autocompletion(),
                    placeholder(`# Once PyScript loaded, you can code here!`),
                    keymap.of([
                        ...defaultKeymap,
                        ...historyKeymap,
                        ...searchKeymap,
                        ...commentKeymap
                    ]),
                    EditorView.lineWrapping,
                ]
            }),
            ".cm-scroller": {overflow: "auto"}
            parent: document.getElementById('editor-container')
        });
        console.log(`[codemirror/main]: Setup success`)
        function getCode() {
            return editor.state.doc.toString();
        }
    
        function setCode(code) {
            editor.dispatch({
                changes: {
                    from: 0,
                    to: editor.state.doc.length,
                    insert: code || ''
                }
            });
        }
    
        window.codeEditor = editor;
        window.getCode = getCode;
        window.setCode = setCode;
        function setPlaceholder(text) {
            editor.dispatch({
                effects: placeholder.reconfigure(placeholder(text))
            });
        }
        window.setPlaceholder = setPlaceholder
        window.console.log(`[codemirror/main]: Initailization finished`);
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './pyscript/core.js';
        document.head.appendChild(script);
    </script>

    <script>
        function downloadCode() {
            const code = window.getCode()
            if (!code.trim()) {
                alert('No code to download!');
                return;
            }
            const ins = prompt("Enter filename (extension will automatically added)", "script")
            if (ins === null) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (ins.trim() || "script") + '.py';
            a.click();
            URL.revokeObjectURL(url);
        }
        document.getElementById('dwnldBtn').onclick = downloadCode;

        function loadCode() {
                if () {
                    alert(`You can't upload code when PyScript is not ready yet!`);
                    return;
                }
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.py,.txt';

                input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = function(event) {
                                const code = event.target.result;
                                document.getElementById('codeInput').value = code;
                                updateEditor();
                        };
                        reader.readAsText(file);
                };

                input.click();
        }
        document.getElementById('loadBtn').onclick = loadCode

        const urlParams = new URLSearchParams(window.location.search);
        const sharedCode = urlParams.get('code');

        if (sharedCode) {
            window.setPlaceholder(`# Looks like you opened shared code!
# Please wait, loading your code...`);
        }

    <script type="py">
        import pyscript, asyncio, micropip
        data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))

        import js, m2w
        from pyscript import storage as s
        from asyncio import run as a
        from random import choice as c
        
        class SLD:
                 def __init__(self, name=None):
                    if name is None:
                        q = "qwertyuiopasdfghjklzxcvbnm1234567890"
                        name = "".join([c(q) for _ in "-"*6])
                    self.name = name

                 async def init(self):
                     """RUN ME before anything"""
                     self.storage = await s(self.name)
                 def __repr__(self):
                     return f"<pyscript.storage (SLD): {self.name}>"
                 async def sync(self):
                     """Synchronization"""
                     await self.storage.sync()
                 async def save(self, name, item):
                     """Saves item to persistent storage"""
                     self.storage[name] = item
                     await self.sync()
                 async def load(self, name):
                     """Loads item from persistent storage"""
                     await self.sync()
                     return self.storage.get(name)
                 async def delete(self, name):
                     """Deletes item from persistent storage"""
                     if name in self.storage.keys():
                         del self.storage[name]
                         await self.sync()
                     else:
                         raise KeyError(f"Key {name} doesn't exist!")
                 
        from pyodide.ffi import create_proxy, JsNull as null
        connect = m2w.Main(id="#executer")
        storage = SLD("codeStorage")
        await storage.init()
        def codeparse(): 
            return pyscript.window.getCode()
        async def saveBtn(event):
            code = codeparse()
            if code:
                name = js.prompt("What do you want to name your code as? ", code.split("\n")[0])
                if name is null or name is None: 
                    return
                name = name.strip().rstrip()
                if not name:
                    return
                if name in storage.storage.keys():
                   if js.confirm("Name exists! Do you want to override it?"):
                     await storage.save(name, code)
                else:
                     await storage.save(name, code)
                js.alert("Saved!")
            else:
                js.alert("No code to save!")
        async def loadB(event):
             alls = storage.storage
             if not alls:
                 js.alert("No saved projects found!")
                 return 
             build = "\n".join(["- " + per for per in alls.keys()])
             pr = "Saved projects:\n" + build + "\nEnter name of saved code to load:"
             nm = js.prompt(pr)
             if nm is null or nm is None: 
                return
             nm = nm.strip().rstrip()
             if not nm:
                 return
             if nm in alls.keys():
                 pyscript.document.querySelector("#codeInput").value = await storage.load(nm)
                 pyscript.window.updateEditor()
                 js.alert(f"Successfully loaded {nm}!")
             else:
                 js.alert(f"{nm} doesn't found!")
        async def delB(event):
             alls = storage.storage
             if not alls:
                 js.alert("No saved projects found!")
                 return 
             build = "\n".join(["- " + per for per in alls.keys()])
             pr = "Saved projects:\n" + build + "\nEnter name of saved code to delete:"
             nm = js.prompt(pr)
             if nm is null or nm is None: 
                return
             nm = nm.strip().rstrip()
             if not nm:
                 return
             if nm in alls.keys():
                 await storage.delete(nm)
                 js.alert(f"Successfully deleted {nm}!")
             else:
                 js.alert(f"{nm} doesn't found!")
        
        def onrun(event):
            if connect.getmsg:
                js.alert("Already running code!")
            else:
                connect.sendmsg(codeparse())
        run_btn = pyscript.document.querySelector("#runBtn")
        run_btn.addEventListener("click", create_proxy(onrun))
        run_btn.disabled = False
        
        def inp(event):
            packages = js.prompt("Enter package name (if multiple, split by space)")

                return

            package_list = packages.split()
            run = [
                "print('-----Pip package installer-----')",
                "import asyncio, micropip",
                f"for p in {package_list}:",
                "    try:",
                "        asyncio.ensure_future(micropip.install(p))",
                "        print(f'Installed package {p} successfully' if p in micropip.list().keys() else 'Something went wrong')",
                "    except Exception as e:",
                "        print(f'Failed to install package {p}: {str(e)}')"
            ]
            if connect.getmsg:
                js.alert("Code has been executing, once stopped, you can install")
                return
            js.alert("Results are at Terminal")
            connect.sendmsg("\n".join(run))
            
        def lsp(event):
            run = [
                "import micropip",
                "print(\"-------Pip packages list-------\")",
                "name = micropip.list().keys()",
                "names = name",
                "if len(names) > 50:",
                "    names = name[:49]",

                "build = '- ' + '\\n- '.join(names)",

            if connect.getmsg:

            connect.sendmsg("\n".join(run))

        def stopBtn(event):
            if connect.getmsg:
                 connect.sendmsg("STOP")
            else:
                 js.alert("Cannot stop when code is not running")
        
        pip = [pyscript.document.querySelector("#saveBtn"), pyscript.document.querySelector("#loadB"), pyscript.document.querySelector("#delB"), pyscript.document.querySelector("#pipLs"), pyscript.document.querySelector("#pipIn"), pyscript.document.querySelector("#stopBtn")]
        for x in pip:
            x.disabled = False
        import js, pyscript, base64

        def sharecode(code):
            code_bytes = code.encode('utf-8')
            b64_encoded = base64.urlsafe_b64encode(code_bytes).decode('utf-8')
            uri_encoded = js.encodeURIComponent(b64_encoded)
            base_url = js.window.location.origin + js.window.location.pathname
            share_url = f"{base_url}?code={uri_encoded}"
            return share_url

        def lsc():
            import binascii
            try:
               params = js.URLSearchParams.new(js.window.location.search)
               uri_encoded = params.get('code')
               if uri_encoded:
                  b64_encoded = js.decodeURIComponent(uri_encoded).encode("utf-8")
                  code_bytes = base64.urlsafe_b64decode(b64_encoded).decode('utf-8')
               else:
                  code_bytes = '# Click \'Run\' to run!\nimport sys, datetime\nprint("Hello from Py3IDE!")\nprint("Python version:", sys.version)\ndatenow = datetime.datetime.now()\ndate = f"{datenow.year}.{datenow.month:02d}.{datenow.day:02d} {datenow.hour:02d}:{datenow.minute:02d}"\n# Did you know? :02d in formatted strings (f-strings) makes 1 dight integer to 2 dights integer, as like 2 to 02!\nprint("Current date & time:", date)'
            except (binascii.Error, UnicodeDecodeError) as e:
                js.alert(f"Looks like your link is malformed!\nError details: {e}")
                code_bytes = '# Click \'Run\' to run!\nimport sys, datetime\nprint("Hello from Py3IDE!")\nprint("Python version:", sys.version)\ndatenow = datetime.datetime.now()\ndate = f"{datenow.year}.{datenow.month:02d}.{datenow.day:02d} {datenow.hour:02d}:{datenow.minute:02d}"\n# Did you know? :02d in formatted strings (f-strings) makes 1 dight integer to 2 dights integer, as like 2 to 02!\nprint("Current date & time:", date)'
            pyscript.window.setCode(code_bytes)
        async def shareBtn(event):
            c = codeparse()
            if c:
               o = sharecode(c)
               try:
                   await pyscript.window.navigator.clipboard.writeText(o)
                   js.alert(f"Copied to Clipboard!\nURL: {o}")
               except:
                    js.alert(f"URL: {o}")
            else:
               print("No code to share!")
        pip[3].onclick = create_proxy(lsp)
        pip[4].onclick = create_proxy(inp)
        pip[5].onclick = create_proxy(stopBtn)
        pyscript.document.querySelector("#saveBtn").onclick = create_proxy(lambda event: create_proxy(saveBtn).callPromising(event))
        pyscript.document.querySelector("#loadB").onclick = create_proxy(lambda event: create_proxy(loadB).callPromising(event))
        pyscript.document.querySelector("#delB").onclick = create_proxy(lambda event: create_proxy(delB).callPromising(event))
        svciq = pyscript.document.querySelector("#shareBtn")
        svciq.disabled = False
        svciq.onclick = create_proxy(lambda event: create_proxy(shareBtn).callPromising(event))
        lsc()
        pyscript.document.querySelector("#codeInput").disabled = False
        pyscript.document.querySelector("#codeInput").placeholder = "Write your Python code here..."
        pyscript.document.querySelector("#ready").innerHTML = "Loaded PyScript! Ready to run!"

    <script type="py" terminal worker id="executer">
    import pyscript, asyncio
    data = asyncio.run(pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"))
    with open("m2w.py", "w") as file:
        file.write(asyncio.run(data.text())) if data.ok else None
    import m2w, time, traceback, builtins, inspect, os, sys

    class stderr:
        """Colored sys.STDERR version by Erkhemee"""
        def __init__(self, original=None):
            """Initalize colorful stderr"""
            self.orig = original or sys.stderr
        def write(self, message):
            """Write colorful error in stderr"""
            self.orig.write("\033[91m" + str(message) + "\033[0m")
        def flush(self):
            """Flush it"""
            self.orig.flush()
    sys.stderr = stderr()
        
    inputs = input
    def _input(prompt=""):
        """Asks for user input"""
        i = inputs(str(prompt))
        if inspect.isawaitable(i):
            return asyncio.run(i)
        else:
            return i
    async def run_code(code):
        def runable(c):
            try:
               obj = repr(eval(c))
               if obj != "None":
                   print(obj)
            except SyntaxError:
               exec(c)
                    
        try:
            await asyncio.to_thread(runable, code)
        except asyncio.CancelledError:
            try:
                raise KeyboardInterrupt
            except:
                traceback.print_exc()
        except SystemExit:
            print("Looks like you've run exit()!")
        except:
            print("Error occured! Details:")
            traceback.print_exc()
        finally:
            print("\033[95m=======\033[96mEND\033[95m=======\033[0m")

    async def timer():
        while 1:
            if connect.getmsg == "STOP":
                 break
            await asyncio.sleep(.0825)
        
    async def runcode(code):
        done, pending = await asyncio.wait([asyncio.create_task(run_code(code)), asyncio.create_task(timer())], return_when=asyncio.FIRST_COMPLETED)
        for task in pending:
            task.cancel()
        
    builtins.input = _input
    connect = m2w.Worker()
    cd = os.getcwd()
    print(f"\033[93mReady to run! Python version: {sys.version}\033[0m")
    while 1:
        if connect.getmsg:
            if connect.getmsg == "STOP":
                print("\033c\033[93mWrong code gathered, skipping\033[0m")
                continue
            os.chdir(cd)
            connect.sendmsg("dontrun")
            print("\033c\033[92mCode executing ...\033[96m")
            await runcode(connect.getmsg)
            connect.getmsg = None
            connect.sendmsg("")
        time.sleep(.0825)
    </script>
