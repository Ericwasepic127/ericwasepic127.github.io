<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <script src="./mini-coi-fd.js"></script>
        <script type="module" src="./pyscript/core.js"></script>
        <link rel="stylesheet" href="./pyscript/core.css">
        <link rel="icon" type="image/png" sizes="499x499" href="python.png">
        <title>SUPY3MULTI - Multiple python edit IN once!</title>
    </head>
    <body>
        <py-config>
             packages = ["micropip"]
        </py-config>
        <p><a href="/index.html">Back to homepage</a> | <a href="/ide.html?multi=true" target="_blank">Open new editor</a></p>
        <h3>Welcome to SUPY3MULTI! Version: V6.3.4</h3>
        <p><strong>DO NOT CLOSE</strong> this tab or else editors will stop working</p>
        <p>Wait until 'Ready!' shows up in terminal</p>
        <script type="py" terminal worker>
            import pyscript, traceback
            m2wcode = await pyscript.fetch("https://raw.githubusercontent.com/Ericwasepic127/ericwasepic127/refs/heads/main/m2w.py")
            if m2wcode.ok:
                _x = await m2wcode.text()
                with open("m2w.py", "w") as _obj:
                   _obj.write(_x) if _x else None
            import m2w, asyncio, sys, builtins, time, ast, inspect, code, types, difflib
            from pyodide.ffi import can_run_sync as cRs
            from asyncio import run as asynch

            def a(coroutine):
                """Awaits coroutine"""
                try:
                   if cRs():
                      return asynch(coroutine)
                except (BaseException, Exception) as e: 
                   if "stack" in str(e).lower():
                      pass
                   else:
                      raise
                async def coro_wrap():
                    try:
                       x = await coroutine
                       return False, x
                    except (BaseException, Exception) as e:
                       return True, e
                       
                coro = asyncio.create_task(coro_wrap())
                while not coro.done():
                    time.sleep(.0825)
                status, info = coro.result()
                if status:
                    raise info
                return info
            asyncio.run = a

            class Terminal(code.InteractiveConsole):
                def __init__(self, *args, **kwargs):
                    super().__init__(*args, **kwargs)
                    self.compile.compiler.flags |= ast.PyCF_ALLOW_TOP_LEVEL_AWAIT
                    self.set_error = False
                def get_error(self):
                    current = self.set_error
                    self.set_error = False
                    return current
                async def runcode(self, code_obj):
                    try:
                      try:
                        res = eval(code_obj, self.locals)
                        if inspect.isawaitable(res):
                            res = await res
                      except SyntaxError:
                        pass
                      else:
                        return repr(res) if res != None else ""
                      x = exec(code_obj, self.locals)
                      if inspect.isawaitable(x):
                        await x
                    except SystemExit:
                        print("Looks like you've run exit()!")
                        raise
                    except:
                        self.showtraceback()
                    return await asyncio.sleep(0.0000001, result="")
                def runsource(self, source, filename="<input>", symbol="single"):
                    try:
                        code = self.compile(source, filename, symbol)
                    except (OverflowError, SyntaxError, ValueError):
                        self.showsyntaxerror(filename, source=source)
                        return False
                    if code is None:
                        return True
                    a(self.runcode(code))
                    return False
    
                def showtraceback(self, *args, **kwargs):
                    self.set_error = True
                    print("Error occured! Details:", file=sys.stderr)
                    return super().showtraceback(*args, **kwargs)
                def showsyntaxerror(self, *args, **kwargs):
                    self.set_error = True
                    print("Error occured! Details:", file=sys.stderr)
                    return super().showsyntaxerror(*args, **kwargs)

            class FakeModule(types.ModuleType):
                def __dir__(self):
                    mod = dir(object.__getattribute__(self, "module"))
                    dld = object.__getattribute__(self, "delete").keys()
                    usr = list(object.__getattribute__(self, "user").keys())
                    mod = sorted(mod + usr)
                    for i in dld:
                        mod.remove(i)
                    return mod
                def __repr__(self):
                    return repr(object.__getattribute__(self, "module"))
                def __init__(self, actual_module):
                    types.ModuleType.__init__(self, getattr(actual_module, "__name__", "<unknown>"))
                    object.__setattr__(self, "module", actual_module)
                    object.__setattr__(self, "user", {})
                    object.__setattr__(self, "delete", {})
                    object.__setattr__(self, "__class__", getattr(actual_module, "__class__"))
                    object.__setattr__(self, "__doc__", getattr(actual_module, "__doc__"))
                    object.__setattr__(self, "__file__", getattr(actual_module, "__file__"))
                    object.__setattr__(self, "__loader__", getattr(actual_module, "__loader__"))
                    object.__setattr__(self, "__package__", getattr(actual_module, "__package__"))
                    object.__setattr__(self, "__spec__", getattr(actual_module, "__spec__"))
                    object.__setattr__(self, "__builtins__", getattr(actual_module, "__builtins__"))
                    object.__setattr__(self, "__path__", getattr(actual_module, "__path__"))
                def __getattr__(self, name):
                    mod = object.__getattribute__(self, "module")
                    def raiser(name):
                        m = difflib.get_close_matches(name.lower(), dir(mod), n=1, cutoff=0.6)
                        if m:
                             m = f"Did you mean {m[0]!r}?"
                        else:
                             m = ""
                        raise AttributeError(f"module {mod.__name__!r} does not have attribute {name!r}. %s" % m)
                    usr = object.__getattribute__(self, "user")
                    dld = object.__getattribute__(self, "delete")
                    ismod = hasattr(mod, name) and name not in dld.keys()
                    return usr.get(name, raiser(name) if not ismod else getattr(mod, name))

            importer = __import__

            def _import(name, *args, **kwargs):
                return FakeModule(importer(name, *args, **kwargs))

            _import.__doc__ = importer.__doc__

            class DictLike(dict):
                def __getitem__(self, name):
                    if name == "__import__":
                        return _import
                    if hasattr(builtins, name):
                        return getattr(builtins, name)
                    return super().__getitem__(name) 

            def run_code(c):
                runner = Terminal({"__name__": "__main__", "__builtins__": DictLike()})
                runner.runsource(c, symbol="exec", filename="<SUPY3-interpreter>")
        
            async def runcode(code, timer):
                coder = asyncio.create_task(asyncio.to_thread(run_code, code))
                timeis = asyncio.create_task(timer)
                done, pending = await asyncio.wait([coder, timeis], return_when=asyncio.FIRST_COMPLETED)
                try:
                    if coder in pending:
                        raise KeyboardInterrupt
                    if coder.done():
                        exc = coder.exception()
                        if exc:
                           raise exc
                except SystemExit:
                    print("Looks like you've run exit()!")
                finally:
                    for task in pending:
                        task.cancel()
                    print("\033[95m=======\033[92mEND\033[95m=======\033[0m\n")
                    connect.sendmsg("")
                    connect.handler(handler)
                    _write("Handled execution successfully!\n\n")
            
            connect = m2w.specTab("host", id="pythonCode")
            editors = []
            _read = input
            _write = sys.__stdout__.write
            _error = sys.__stderr__.write
            non = lambda: None
            
            def handler(content):
                global editors
                connect.sendmsg("busy")
                if content.get("assign"):
                    name = content["assign"]
                    if not (name in editors):
                        editors.append(name)
                        _write(f"Editor added! ID: {int(name):04d}\n")
                        connect.sendmsg("")
                    else:
                        _write("ID conflict - ID {int(name):04d} already assigned!\n")
                    return
            
                name = content.get("from")
                got = content.get("got")
                if name in editors:
                    _write(f"\nHandling execution from ID {int(name):04d}\n")
                    async def read(value=""):
                        f = asyncio.Future()
                        hold = connect.worker.onmessage
                        def when(msg):
                            if msg.get("from") == name:
                                f.set_result(msg.get("got"))
                            connect.handler(hold)
                        connect.handler(when)
                        connect.sendTab(name, {"request": "read", "from": "host", "got": value})
                        return await f
                    def write(value):
                        if not value:
                            return
                        connect.sendTab(name, {"request": "write", "from": "host", "got": value})
                    def error(value):
                        if not value:
                            return
                        connect.sendTab(name, {"request": "error", "from": "host", "got": value})
                    builtins.input = lambda t="": asyncio.run(read(t))
                    sys.stdout.write = write
                    sys.stderr.write = error
                    sys.stdout.flush, sys.stderr.flush = non, non
                    msg = {}
                    def h(n):
                        global msg
                        msg = n
                    connect.handler(h)
                    async def timer():
                        while 1:
                            if msg.get("from") == name and msg.get("got") == "CLEAR":
                                break
                            await asyncio.sleep(.0825)
                    asyncio.create_task(runcode(got, timer()))
            connect.handler(handler)
            _write("\033[93mReady!\n")
                            
        </script>
    </body>
</html>
