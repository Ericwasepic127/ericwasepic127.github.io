name: Update PyScript

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [uptodate]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get latest PyScript version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Download PyScript
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          wget -O pyscript.zip https://pyscript.net/releases/$LATEST/offline_$LATEST.zip
          unzip -o pyscript.zip -d ./tmp/
          rm -rf ./pyscript/*
          mv ./tmp/offline/pyscript/* ./pyscript/
          rm -rf ./tmp/

      - name: Update version file
        run: echo "${{ steps.version.outputs.version }}" > pyscript-version.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update PyScript to ${{ steps.version.outputs.version }}"
          title: "Update PyScript to ${{ steps.version.outputs.version }}"
          body: "This PR updates PyScript to the latest release.\n\n**Version:** ${{ steps.version.outputs.version }}"
          branch: "update-pyscript-${{ steps.version.outputs.version }}"
          base: "main"
          labels: "automated-pr"
