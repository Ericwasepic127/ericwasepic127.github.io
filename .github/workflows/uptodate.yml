name: Update PyScript

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pyscript-update]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get latest PyScript version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Download PyScript
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          wget -O pyscript.zip https://pyscript.net/releases/$LATEST/offline_$LATEST.zip
          unzip -o pyscript.zip -d ./tmp/
          rm -rf ./pyscript/
          mv ./tmp/offline/pyscript/* ./pyscript/
          rm -rf ./tmp/

      - name: Update version file
        run: echo "${{ steps.version.outputs.version }}" > pyscript-version.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./pyscript/ pyscript-version.txt
          git commit -m "Update PyScript to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push || echo "No changes to push"
