name: Update PyScript

on:
  workflow_dispatch:
  repository_dispatch:
    types: [uptodate]

jobs:
  initailize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create branch for update
        run: |
          git checkout -b pyscript-latest || git checkout pyscript-latest
          git push --set-upstream origin pyscript-latest || true
          
  start-modify:
      needs: initailize
      runs-on: ubuntu-latest
      steps:
      - name: Get latest PyScript version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Download and extract PyScript
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyscript/pyscript/releases/latest | jq -r .tag_name)
          wget -O pyscript.zip https://pyscript.net/releases/$LATEST/offline_$LATEST.zip
          mkdir -p ./pyscript-temp
          unzip -o pyscript.zip -d ./pyscript-temp/
          rm -rf ./pyscript/*
          mkdir -p ./pyscript
          mv ./pyscript-temp/offline/pyscript/* ./pyscript/
          rm -rf ./pyscript-temp/

      - name: Update version file
        run: echo "${{ steps.version.outputs.version }}" > pyscript-version.txt
      - name: Commit changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add ./pyscript/ pyscript-version.txt
          git commit -m "Update PyScript to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push --set-upstream origin pyscript-latest

      - name: Create Pull Request
        uses: ws2git/gh-pr-creator-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          title: "Update PyScript to ${{ steps.version.outputs.version }}"
          body: "This PR updates PyScript to the latest version.\n\n**Version:** ${{ steps.version.outputs.version }}"
          source_branch: "pyscript-latest"
          dest_branch: "main"
