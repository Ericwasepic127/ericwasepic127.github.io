name: Zip it shipit

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Brancher
        run: |
          git checkout -b release || git checkout release
          git push --set-upstream origin release || git branch --set-upstream-to=origin/release release || echo "$(git pull origin release && git push origin release)" || true
      - name: Zip it
        run: |
            mkdir build
            mkdir offline
            cp -r release/ offline/
            zip -r offline.zip tmp -i offline/release/
            mv offline.zip ./build/
      - name: Upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "git"
          git push --force origin release
      - name: Produce
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"relnow"}'
          
