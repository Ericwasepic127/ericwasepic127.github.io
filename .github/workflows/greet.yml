name: Welcome Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome New Issue
        if: github.event_name == 'issues'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "Hello @${{ github.actor }}! Thank you for opening this issue. Your suggestions, bugs that you found, features will help to me! @Ericwasepic127 might be look sooner depending on he is coding or busy now."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Welcome New PR
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "Hey @${{ github.actor }}! Thanks for contributing and helping to me! @Ericwasepic127 might be look sooner depending on he is coding or busy now."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
