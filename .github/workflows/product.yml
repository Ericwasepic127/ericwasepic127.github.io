name: Production branch creator

on: 
  workflow_dispatch: 
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: |
            git checkout -b product || git checkout product
            git push --set-upstream origin product || git branch --set-upstream-to=origin/product product || true
            cd release || mkdir release && cd release
            mkdir pyscript
            mkdir ace
            cp ../LICENSE LICENSE
            cp -r ../pyscript/* pyscript/
            cp ../demo.html index.html
            cp ../ide.html ide.html
            cp ../hello.html repl.html
            cp ../mini-coi-fd.js mini-coi-fd.js
            cp ../python.png python.png
            cp ../host.html host.html
            cp ../window.js window.js
            cp ../window.css window.css
            sed -i 's|"https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py"|__import__("js").location.origin + "/m2w.py"|gI' *.html
            sed -i 's|"https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/pager.py"|__import__("js").location.origin + "/pager.py"|gI' repl.html
            sed -i 's#<a href="/archived_terminal.html">Legacy Terminal</a> | #<p></p>#g' repl.html
            sed -i 's|href="/hello.html"|href="/repl.html"|g' ide.html
            sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.0/|./ace/|g' ide.html
            curl -o m2w.py https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/m2w.py
            curl -o pager.py https://raw.githubusercontent.com/Ericwasepic127/Ericwasepic127/refs/heads/main/pager.py
            cd ..
            git clone https://github.com/ajaxorg/ace-builds.git
            cp -r ace-builds/src-min-noconflict/* release/ace/
            shopt -s extglob
            rm -rf !(release)
            mv release/* .
            rm -rf release/
            rm -rf .github/
            rm -r .htaccess
            
      - name: Upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Production"
          git push --force origin product
      - name: Move product tag
        run: |
          git tag -f product-built
          git push --force origin product-built

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "product-built"
          make_latest: false
          title: "Production build"
          body: "This is production release, click on Source code to download production release"
          overwrite_files: true
