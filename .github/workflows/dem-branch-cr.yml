name: Demo branch creator

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        run: |
            git checkout -b release || git checkout release
            git push --set-upstream origin release || git branch --set-upstream-to=origin/release release || true
            cd release || mkdir release && cd release
            mkdir pyscript
            cp -r ../pyscript/* pyscript/
            cp ../demo.html index.html
            cp ../ide.html ide.html
            cp ../hello.html repl.html
      - name: Upload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit
          git push
      
