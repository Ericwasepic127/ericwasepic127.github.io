name: Update Pyodide

on:
  workflow_dispatch:
  repository_dispatch:
    types: [uptodater]

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Mark as did updated
        run: touch update.pyodide.lock && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add . && git commit -m "Pyodide lock" && git push --force origin main || true
      - name: Checkout again
        uses: actions/checkout@v6
      - name: Create branch for update
        run: |
          git checkout -b pyodide-latest || git checkout pyodide-latest
          git push --set-upstream origin pyodide-latest || git branch --set-upstream-to=origin/pyodide-latest pyodide-latest || true
      - name: Fetch latest version and update to it
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/pyodide/pyodide/releases/latest | jq -r '.tag_name')
          echo "version=v$LATEST" >> $GITHUB_OUTPUT
          python3 ./pydate.py v$LATEST
          echo "v$LATEST" > pyodide-version.txt
          CURRENT="$(pwd)"
          cd /tmp
          npm install pyodide@$LATEST
          rm -rf $CURRENT/pyscript/pyodide/*
          cp -r node_modules/pyodide/* "$CURRENT/pyscript/pyodide/"
          cd "$CURRENT"
          git add .
          git commit -m "Update Pyodide to $LATEST" || echo "No changes to commit"
          git rm update.pyodide.lock && git commit -m "Removed lock" || true

      - name: Commit changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin pyodide-latest

      - name: Create Pull Request
        uses: ws2git/gh-pr-creator-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          title: "Update Pyodide to ${{ steps.version.outputs.version }}"
          body: "This PR updates Pyodide to the latest version.\n\n**Version:** ${{ steps.version.outputs.version }}"
          source_branch: "pyodide-latest"
          dest_branch: "main"
