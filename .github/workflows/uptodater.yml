name: Update Pyodide

on:
  workflow_dispatch:
  repository_dispatch:
    types: [uptodater]

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create branch for update
        run: |
          git checkout -b pyodide-latest || git checkout pyscript-latest
          git push --set-upstream origin pyodide-latest || git branch --set-upstream-to=origin/pyscript-latest pyscript-latest || true
      - name: Fetch latest version and update to it
        id: version
        run: |
          LATEST=v$(curl -s https://api.github.com/repos/pyodide/pyodide/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          python3 ./pydate.py $LATEST

      - name: Update version file
        run: echo "${{ steps.version.outputs.version }}" > pyodide-version.txt
      - name: Commit changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update PyScript to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push --force origin pyodide-latest

      - name: Create Pull Request
        uses: ws2git/gh-pr-creator-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          title: "Update Pyodide to ${{ steps.version.outputs.version }}"
          body: "This PR updates Pyodide to the latest version.\n\n**Version:** ${{ steps.version.outputs.version }}"
          source_branch: "pyodide-latest"
          dest_branch: "main"
