<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background: #fff;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
        }

        .card-header {
            background: #1f2937;
            color: #fff;
            padding: 40px 20px;
        }

        .card-header h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .card-header p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
        }

        .card-body {
            padding: 40px 30px;
        }

        .info-item {
            margin-bottom: 25px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .info-value {
            font-size: 18px;
            color: #111827;
            font-weight: 500;
            text-decoration: none;
        }

        a.info-value {
            color: #3b82f6;
            transition: color 0.2s ease;
        }

        a.info-value:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .card-footer {
            padding: 20px;
            background-color: #f9fafb;
            border-top: 1px solid #f3f4f6;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="card-header">
            <h2>Let's Connect</h2>
            <p>Feel free to reach out directly through any of the channels below.</p>
        </div>

        <div class="card-body">
            <div class="info-item">
                <span class="info-label">Email</span>
                <a href="mailto:ericwasepic127@outlook.com" class="info-value">ericwasepic127@outlook.com</a>
            </div>

            <div class="info-item">
                <span class="info-label">Facebook</span>
                <a href="https://m.facebook.com/Ericwasepic127/" class="info-value">Ericwasepic127</a>
            </div>

            <div class="info-item">
                <span class="info-label">WhatsApp</span>
                <a href="https://wa.me/ericwasepic127/" class="info-value">Ericwasepic127</a>
            </div>
        </div>

        <div class="card-footer">
            &copy; 2026 Erkhembayr Batjargal. All rights reserved.
        </div>
    </div>

</body>
</html>
